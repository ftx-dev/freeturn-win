name: Windows build
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing draft release to attach installers to (leave empty for build only)'
        required: false
        type: string
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: helper/go.mod
          cache-dependency-path: |
            helper/go.sum
            third_party/amnezia-box/go.sum
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install NSIS
        run: choco install nsis --no-progress -y
      - name: Test application logic
        run: dotnet test src/FreeTurn.Core.Tests -c Release
      - name: Test helper
        working-directory: helper
        run: go test -ldflags=-checklinkname=0 ./...
      - name: Build Windows installers
        shell: pwsh
        run: ./scripts/Build-Windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: dist/*
          if-no-files-found: error
      - name: Upload installers to draft release
        if: inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [xml]$props = Get-Content Directory.Build.props
          if ($env:RELEASE_TAG -ne "v$($props.Project.PropertyGroup.Version)") { throw 'Release version mismatch' }
          $release = gh release view $env:RELEASE_TAG --json isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$release.isDraft) { throw 'Only an existing draft release can receive builds' }
          gh release upload $env:RELEASE_TAG (Get-ChildItem dist -File | ForEach-Object FullName) --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
