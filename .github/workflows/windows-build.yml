name: Windows build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: helper/go.mod
          cache-dependency-path: |
            helper/go.sum
            third_party/amnezia-box/go.sum
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install NSIS
        run: choco install nsis --no-progress -y
      - name: Test application logic
        run: dotnet test src/FreeTurn.Core.Tests -c Release
      - name: Test helper
        working-directory: helper
        run: go test -ldflags=-checklinkname=0 ./...
      - name: Build Windows installers
        shell: pwsh
        run: ./scripts/Build-Windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: dist/*
          if-no-files-found: error
